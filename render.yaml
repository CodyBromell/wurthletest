services:
  - type: web
    name: wurthle
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/reviews.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
